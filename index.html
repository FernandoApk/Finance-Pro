<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Pro v2.9</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --azul: #38bdf8;
            --verde: #4ade80;
            --vermelho: #fb7185;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* --- ESTILO DA MARCA (SPLASH & FOOTER) --- */
        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .splash-chart {
            display: flex; align-items: flex-end; gap: 4px; height: 50px; padding-bottom: 5px;
        }

        .bar {
            width: 8px; background: var(--azul); border-radius: 2px;
            animation: barGrow 1s ease-in-out infinite alternate;
        }

        .bar1 { height: 40%; animation-delay: 0.1s; }
        .bar2 { height: 80%; animation-delay: 0.3s; }
        .bar3 { height: 60%; animation-delay: 0.5s; }

        @keyframes barGrow {
            0% { transform: scaleY(0.5); opacity: 0.5; }
            100% { transform: scaleY(1.2); opacity: 1; }
        }

        .typing-container { display: flex; flex-direction: column; width: fit-content; }

        .typing-text {
            font-size: 32px; font-weight: 800; color: var(--azul); overflow: hidden;
            border-right: 3px solid var(--azul); white-space: nowrap; letter-spacing: 2px; width: 0;
        }

        .author-text {
            font-size: 14px; color: var(--text-dim); opacity: 0; margin-top: 4px;
            width: 100%; text-align: center;
        }

        /* Animações da Abertura */
        .splash .typing-text { animation: typing 1.5s steps(11, end) 0.5s forwards, blink-caret 0.75s step-end infinite; }
        .splash .author-text { animation: slideName 1.2s ease 2s forwards; }

        /* Estilo do Rodapé */
        .footer-brand .typing-text { width: 100%; border: none; }
        .footer-brand .author-text { opacity: 1; text-align: right; }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--azul) } }
        @keyframes slideName {
            0% { opacity: 0; transform: translateY(10px); text-align: center; }
            100% { opacity: 1; transform: translateY(0); text-align: right; }
        }

        /* --- SPLASH SCREEN --- */
        .splash {
            position: fixed; inset: 0; background: #020617;
            display: flex; align-items: center; justify-content: center;
            z-index: 999; animation: fadeOut 0.8s ease 6s forwards; 
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* --- FOOTER BRAND (RÉPLICA DA ABERTURA) --- */
        .footer-brand {
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px; opacity: 0.5; margin-top: 30px; border-top: 1px solid #1e293b;
            transform: scale(0.65); /* Escala para caber no rodapé mantendo a proporção */
        }

        /* --- LAYOUT DO APP --- */
        .nav { 
            display: flex; background: #020617; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid #334155;
        }
        .nav button {
            flex: 1; padding: 16px; border: none; background: none; 
            color: var(--text-dim); font-weight: bold; cursor: pointer;
        }
        .nav .active { color: var(--azul); border-bottom: 3px solid var(--azul); }

        .container { padding: 16px; max-width: 600px; margin: auto; min-height: 80vh; }

        .card {
            background: var(--card); padding: 18px; border-radius: 16px;
            margin-bottom: 16px; border: 1px solid #334155;
        }

        h3 { margin: 0 0 12px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }

        .grid-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .mini-card { padding: 12px; border-radius: 12px; background: #020617; text-align: center; }
        .valor { font-size: 18px; font-weight: bold; display: block; }

        label { font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
            background: #0f172a; color: white; margin-top: 5px; margin-bottom: 15px; font-size: 16px;
            font-family: inherit;
        }
        textarea { resize: none; height: 80px; }

        .btn {
            padding: 14px; width: 100%; border: none; border-radius: 12px;
            background: var(--azul); color: #020617; font-weight: bold; cursor: pointer;
        }
        .btn-outline { background: transparent; border: 1px solid var(--azul); color: var(--azul); margin-top: 8px; }

        .item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; margin-top: 8px; background: #020617; border-radius: 10px;
        }
        .item-info b { display: block; font-size: 14px; }
        .item-info small { color: var(--text-dim); font-size: 11px; display: block; line-height: 1.3; }
        .val-receita { color: var(--verde); }
        .val-despesa { color: var(--vermelho); }
        .btn-del { background: none; border: none; color: var(--vermelho); cursor: pointer; padding: 5px; font-weight: bold; }

        .chart-container { position: relative; height: 250px; width: 100%; }
        .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .dia { padding: 8px 0; text-align: center; background: #020617; border-radius: 6px; font-size: 11px; }
        .dia.tem { background: var(--azul); color: #020617; font-weight: bold; }
    </style>
</head>
<body>

<div class="splash">
    <div class="brand-wrapper">
        <div class="splash-chart">
            <div class="bar bar1"></div>
            <div class="bar bar2"></div>
            <div class="bar bar3"></div>
        </div>
        <div class="typing-container">
            <div class="typing-text">Finance Pro</div>
            <div class="author-text">by Fernando Almeida</div>
        </div>
    </div>
</div>

<div class="nav">
    <button onclick="trocar('dash', this)" class="active">Dashboard</button>
    <button onclick="trocar('add', this)">Novo</button>
    <button onclick="trocar('hist', this)">Histórico</button>
</div>

<div class="container">
    <div id="dash">
        <div class="card">
            <label>Mês de Referência</label>
            <input type="month" id="mes" onchange="atualizar()">
        </div>
        <div id="resumo" class="grid-resumo"></div>
        <div class="card">
            <h3 id="titulo-grafico">📊 Distribuição</h3>
            <div class="chart-container"><canvas id="grafico"></canvas></div>
        </div>
        <div class="card">
            <h3>🧠 Insights IA</h3>
            <div id="ia2" style="font-size: 14px; border-left: 3px solid var(--azul); padding-left: 10px;"></div>
        </div>
        <div class="card">
            <h3>📅 Calendário</h3>
            <div id="calendario" class="cal"></div>
        </div>
        <div class="card">
            <h3>📑 Extrato do Mês</h3>
            <div id="extrato-dash"></div>
        </div>
        <div class="card">
            <h3>📥 Backup e Dados</h3>
            <button class="btn btn-outline" onclick="exportar()">Exportar Backup</button>
            <input type="file" id="fileImport" style="display:none" onchange="importar(event)">
            <button class="btn btn-outline" onclick="document.getElementById('fileImport').click()">Importar Backup</button>
        </div>
    </div>

    <div id="add" style="display:none">
        <div class="card">
            <h3>📝 Novo Lançamento</h3>
            <label>Descrição</label>
            <input id="desc" placeholder="Ex: Mercado, Salário...">
            <label>Detalhes (Opcional)</label>
            <textarea id="detalhes" maxlength="200" placeholder="Alguma observação?"></textarea>
            <label>Categoria</label>
            <select id="categoria">
                <option>Alimentação</option><option>Moradia</option>
                <option>Transporte</option><option>Lazer</option>
                <option>Saúde</option><option>Trabalho</option>
                <option>Outros</option>
            </select>
            <label>Valor</label>
            <input id="valor" type="tel" placeholder="R$ 0,00" oninput="formatarMoeda(this)">
            <label>Data</label>
            <input type="date" id="data">
            <label>Tipo</label>
            <select id="tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select>
            <button class="btn" onclick="salvar()">Salvar</button>
        </div>
    </div>

    <div id="hist" style="display:none">
        <div class="card">
            <h3>📑 Histórico Completo</h3>
            <div id="lista"></div>
            <button class="btn btn-outline" style="border-color: var(--vermelho); color: var(--vermelho); margin-top: 20px;" onclick="limparTudo()">Limpar Tudo</button>
        </div>
    </div>

    <div class="footer-brand">
        <div class="brand-wrapper">
            <div class="splash-chart">
                <div class="bar bar1"></div>
                <div class="bar bar2"></div>
                <div class="bar bar3"></div>
            </div>
            <div class="typing-container">
                <div class="typing-text">Finance Pro</div>
                <div class="author-text">by Fernando Almeida</div>
            </div>
        </div>
    </div>
</div>

<script>
let dados = JSON.parse(localStorage.getItem('fin_v2')) || [];
let graficoInstance = null;

const f = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

function formatarMoeda(el) {
    let v = el.value.replace(/\D/g, '');
    v = (v / 100).toFixed(2) + '';
    v = v.replace(".", ",");
    v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    el.value = v !== "0.00" ? "R$ " + v : "";
}

function trocar(id, btn) {
    document.querySelectorAll('.container > div').forEach(e => { if(e.id) e.style.display='none' });
    document.getElementById(id).style.display = 'block';
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.scrollTo(0,0);
}

function salvar() {
    const desc = document.getElementById('desc').value;
    const detalhes = document.getElementById('detalhes').value;
    const valRaw = document.getElementById('valor').value.replace(/[R$\s.]/g, '').replace(',', '.');
    const valor = parseFloat(valRaw);
    const data = document.getElementById('data').value;

    if(!desc || !valor || !data) return alert("Preencha todos os campos obrigatórios!");

    dados.push({ id: Date.now(), desc, detalhes, categoria: document.getElementById('categoria').value, valor, tipo: document.getElementById('tipo').value, data });
    localStorage.setItem('fin_v2', JSON.stringify(dados));
    document.getElementById('desc').value = ''; document.getElementById('detalhes').value = ''; document.getElementById('valor').value = '';
    alert("Salvo!"); atualizar(); trocar('dash', document.querySelector('.nav button'));
}

function deletarItem(id) {
    if(confirm("Excluir?")) {
        dados = dados.filter(t => t.id !== id);
        localStorage.setItem('fin_v2', JSON.stringify(dados));
        atualizar();
    }
}

function atualizar() {
    const inputMes = document.getElementById('mes');
    if (!inputMes.value) inputMes.value = new Date().toISOString().slice(0, 7);
    const mesAtual = inputMes.value;
    const filtrados = dados.filter(t => t.data.slice(0, 7) === mesAtual);
    let receitas = 0, despesas = 0, catsDespesa = {}, catsReceita = {};
    
    filtrados.forEach(t => {
        if(t.tipo === 'receita') { receitas += t.valor; catsReceita[t.categoria] = (catsReceita[t.categoria] || 0) + t.valor; }
        else { despesas += t.valor; catsDespesa[t.categoria] = (catsDespesa[t.categoria] || 0) + t.valor; }
    });

    document.getElementById('resumo').innerHTML = `<div class="mini-card"><label>Ganhos</label><span class="valor val-receita">${f(receitas)}</span></div><div class="mini-card"><label>Gastos</label><span class="valor val-despesa">${f(despesas)}</span></div><div class="mini-card" style="grid-column: span 2"><label>Saldo</label><span class="valor" style="color:var(--azul)">${f(receitas - despesas)}</span></div>`;

    const ctx = document.getElementById('grafico').getContext('2d');
    if(graficoInstance) graficoInstance.destroy();
    let labels = [], dataValores = [], corGrafico = [], titulo = "📊 Distribuição";

    if (Object.keys(catsDespesa).length > 0) {
        titulo = "📊 Gastos por Categoria"; labels = Object.keys(catsDespesa); dataValores = Object.values(catsDespesa); corGrafico = ['#fb7185', '#f472b6', '#fbbf24', '#a78bfa', '#38bdf8'];
    } else if (Object.keys(catsReceita).length > 0) {
        titulo = "📊 Origem das Receitas"; labels = Object.keys(catsReceita); dataValores = Object.values(catsReceita); corGrafico = ['#4ade80', '#2dd4bf', '#38bdf8', '#818cf8'];
    }
    document.getElementById('titulo-grafico').innerText = titulo;
    if (labels.length > 0) {
        graficoInstance = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: dataValores, backgroundColor: corGrafico, borderWidth: 0 }] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', padding: 15 } } } } });
    }

    const calEl = document.getElementById('calendario'); calEl.innerHTML = '';
    for(let i=1; i<=31; i++) {
        const diaStr = `${mesAtual}-${String(i).padStart(2, '0')}`;
        const temMov = dados.some(d => d.data === diaStr);
        calEl.innerHTML += `<div class="dia ${temMov ? 'tem' : ''}">${i}</div>`;
    }

    const templateItem = (t) => `<div class="item"><div class="item-info"><b>${t.desc}</b><small>${t.categoria} • ${t.data.split('-').reverse().join('/')}</small>${t.detalhes ? `<small style="font-style:italic; opacity:0.8">"${t.detalhes}"</small>` : ''}</div><div style="text-align:right"><span class="${t.tipo === 'receita' ? 'val-receita' : 'val-despesa'}">${f(t.valor)}</span><button class="btn-del" onclick="deletarItem(${t.id})">✕</button></div></div>`;
    document.getElementById('extrato-dash').innerHTML = filtrados.length ? filtrados.slice().reverse().map(templateItem).join('') : "Sem registros.";
    document.getElementById('lista').innerHTML = dados.length ? dados.slice().reverse().map(templateItem).join('') : "Vazio.";
}

function exportar() {
    const blob = new Blob([JSON.stringify(dados)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `backup_finance.json`; a.click();
}
function importar(e) {
    const reader = new FileReader();
    reader.onload = (x) => { dados = JSON.parse(x.target.result); localStorage.setItem('fin_v2', JSON.stringify(dados)); atualizar(); alert("Restaurado!"); };
    reader.readAsText(e.target.files[0]);
}
function limparTudo() { if(confirm("Apagar tudo?")) { dados = []; localStorage.removeItem('fin_v2'); atualizar(); } }
atualizar();
</script>
</body>
</html>
